format_version: 4

model_params:
  model_architecture: "cylinder_asym"
  output_shape:
    - 480
    - 360
    - 32
  fea_dim: 9
  out_fea_dim: 256
  num_class: 20          # 模型输出通道数不变，权重兼容
  num_input_features: 16
  use_norm: True
  init_size: 32

dataset_params:
  dataset_type: "cylinder_dataset"
  pc_dataset_type: "SemKITTI_sk"
  ignore_label: 0
  return_test: False
  fixed_volume_space: True
  label_mapping: "./config/label_mapping/semantic-kitti.yaml"
  # ===== Newer College 适配 =====
  max_volume_space:
    - 50        # rho: 50m 足够（Ouster 测距 ~120m 但校园场景近）
    - 3.1415926 # phi: [-π, π] 不变
    - 15        # z_max: 15m! (KITTI是2m，校园建筑高得多)
  min_volume_space:
    - 0         # rho_min: 0 不变
    - -3.1415926
    - -5        # z_min: -5m! (KITTI是-4m，校园有台阶/地下室)
  # ===== 适配结束 =====

train_params:
  model_load_path: "./pretrained/model_save_backup.pt"
  model_save_path: "./model_save_dir/nc_finetuned.pt"
  checkpoint_every_n_steps: 4599
  max_num_epochs: 40
  eval_every_n_steps: 4599
  learning_rate: 0.001
